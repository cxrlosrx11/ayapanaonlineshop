<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a08">
<title>Noir &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout concept: a black storefront with gold hairlines for browsing and ordering; the owner's dashboard is a white work surface inside a black sidebar frame. */
:root{
  --ink:#0b0a08; --ink-2:#14120e; --ink-3:#1d1a14;
  --gold:#c9a24a; --gold-hi:#e6c66f; --gold-deep:#8f6c1f;
  --white:#faf7f0;
  --font-display:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;

  --bg:#0b0a08; --fg:#faf7f0; --surface:#14120e; --surface-2:#1d1a14;
  --border:#322b1c; --accent:#c9a24a; --accent-hi:#e6c66f;
  --mut:#aaa18c; --good:#7fd69c; --warn:#e8b64f; --bad:#f09086;
  --btn-bg:#c9a24a; --btn-fg:#14100a;
  color-scheme:dark;
}
.light{
  --bg:#fffdf8; --fg:#17140d; --surface:#ffffff; --surface-2:#f4efe3;
  --border:#e2d9c4; --accent:#8f6c1f; --accent-hi:#c9a24a;
  --mut:#6b634f; --good:#1f6b3b; --warn:#8a5a0c; --bad:#a3302a;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;line-height:1.15}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--mut)}
.small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--gold-deep)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:24px;font-weight:900;color:var(--gold-hi);text-decoration:none;margin-right:auto;line-height:1}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a,.nav button{background:none;border:0;color:var(--white);text-decoration:none;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.nav a:hover,.nav button:hover{color:var(--gold-hi)}
.nav a.on{border-bottom-color:var(--gold);color:var(--gold-hi)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:800;text-align:center;line-height:20px}
.who{font-size:13px;color:var(--mut);padding:0 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:transparent;color:var(--accent-hi);padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;border-radius:2px}
.light .btn{color:var(--accent)}
.btn:hover{background:rgba(201,162,74,.12)}
.btn-gold{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.light .btn-gold{color:var(--btn-fg)}
.btn-gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.light .btn-danger{color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent-hi);text-decoration:underline;cursor:pointer;font-weight:600}
.light .link{color:var(--accent)}

/* shop */
.hero{padding-block:44px 28px;border-bottom:1px solid var(--border)}
.hero h1{font-size:clamp(38px,7vw,68px);color:var(--white);font-weight:900}
.hero p{max-width:52ch;color:var(--mut);margin:14px 0 0;font-size:16px}
.rule{width:64px;height:3px;background:var(--gold);margin:18px 0 0}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:22px}
.search{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--border);padding:10px 14px;border-radius:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--border);color:var(--mut);padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;border-radius:999px}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);background:var(--gold);color:var(--ink);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding-bottom:56px}
.card{background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--gold-deep)}
.card-media{position:relative;display:block;width:100%;aspect-ratio:4/5;max-width:100%;border:0;padding:0;background:#fff;cursor:pointer;overflow:hidden}
.fill{position:absolute;inset:0}
.card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:84px;color:var(--gold-deep)}
.card-body{display:flex;flex-direction:column;gap:6px;padding:14px;flex:1;min-width:0}
.card-body h3{font-size:19px;overflow-wrap:anywhere}
.cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.price{font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--gold-hi)}
.stock{font-size:12px;color:var(--mut)}
.stock.low{color:var(--warn)}
.stock.out{color:var(--bad)}
.card-body .btn{margin-top:auto}

.panel{background:var(--surface);border:1px solid var(--border);padding:20px;min-width:0}
.notice{border:1px solid var(--gold-deep);background:var(--surface);padding:18px 20px;margin-block:24px;max-width:62ch}
.empty{text-align:center;padding:64px 16px;border:1px dashed var(--border);margin-bottom:56px;color:var(--mut)}
.empty h2{color:var(--fg);font-size:28px;margin-bottom:8px}
.hero~.wrap .empty h2{color:var(--white)}
.page{padding-block:32px 64px}
.page>h1{font-size:40px;margin-bottom:6px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid var(--border);padding:10px 12px;border-radius:2px;width:100%;min-width:0;color:var(--fg)}
.field textarea{min-height:84px;resize:vertical}
.light .field input,.light .field select,.light .field textarea{background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--bad);font-size:13px;margin:0 0 12px}
.ok{color:var(--good);font-size:13px;margin:0 0 12px}
.check{display:flex;gap:10px;align-items:center;margin-bottom:14px}

/* cart */
.cart{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:0}
.line h3{font-size:18px;overflow-wrap:anywhere}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border)}
.qty button{background:none;border:0;width:32px;height:32px;cursor:pointer;color:var(--accent-hi);font-weight:800}
.qty span{min-width:30px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--gold-deep);padding-top:14px;margin:14px 0}
.total strong{font-family:var(--font-display);font-size:30px;font-weight:900;color:var(--gold-hi)}

.sec{font-size:20px;margin:22px 0 10px}
.radios{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.radios label{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-weight:600}
.radios label:last-child{border-bottom:0}
.radios label.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--gold)}
.radios label.off{opacity:.5;cursor:not-allowed}
.radios input{accent-color:var(--gold);width:18px;height:18px;flex:none;margin:0}
.sum{display:flex;justify-content:space-between;color:var(--mut);padding:2px 0}
.qrcard{background:#fff;padding:14px;border-radius:10px;max-width:340px;margin:18px auto}
.qrcard img{display:block;width:100%;height:auto}
.infobox{background:var(--surface-2);padding:12px 14px;border-radius:10px;font-size:13px;color:var(--mut);margin:12px 0}
/* orders */
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.order{background:var(--surface);border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.order header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.order ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.order li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.order li span:first-child{overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 10px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:700}
.s-pending{color:var(--warn)} .s-accepted{color:var(--accent)} .s-completed{color:var(--good)} .s-declined,.s-cancelled{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;align-items:center}
.meta{font-size:13px;color:var(--mut);overflow-wrap:anywhere}

/* admin */
.admin{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:70vh;border:1px solid var(--gold-deep)}
.side{background:var(--ink);border-right:1px solid var(--gold-deep);padding:20px 0}
.side h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--gold);padding:0 18px 12px}
.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--white);padding:11px 18px;cursor:pointer;font-weight:600}
.side button:hover{color:var(--gold-hi)}
.side button.on{border-left-color:var(--gold);background:rgba(201,162,74,.1);color:var(--gold-hi)}
.main{padding:28px;min-width:0}
.main>h1{font-size:34px;margin-bottom:4px}
.main .sub{margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.tile{border:1px solid var(--border);padding:14px 16px;background:var(--surface)}
.tile .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tile .v{font-family:var(--font-display);font-size:30px;font-weight:900;line-height:1.2}
.tile.gold{background:var(--ink);border-color:var(--ink)}
.tile.gold .k{color:var(--gold)} .tile.gold .v{color:var(--gold-hi)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.box{border:1px solid var(--border);background:var(--surface);padding:16px;min-width:0}
.box h2{font-size:21px;margin-bottom:10px}
.stack{display:grid;gap:18px;max-width:560px}
.scroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
td.r,th.r{text-align:right}
.thumb{width:44px;height:44px;background:#fff;position:relative;overflow:hidden;border:1px solid var(--border)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%}
.thumb .mono{font-size:22px}
.bar{height:6px;background:var(--surface-2);margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent-hi)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(5,4,3,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--bg);color:var(--fg);border:1px solid var(--gold-deep);width:100%;max-width:560px;margin-block:auto;padding:24px;min-width:0}
.modal.wide{max-width:820px}
.modal h2{font-size:28px;margin-bottom:14px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.detail .card-media{cursor:default}
.preview{width:120px;height:150px;position:relative;background:#fff;border:1px solid var(--border);overflow:hidden;max-width:100%}
.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--gold);color:var(--ink);padding:10px 18px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start;padding-block:24px 64px}
.gal{min-width:0}
.stage{position:relative;background:#fff;aspect-ratio:1/1;max-width:100%;overflow:hidden;touch-action:pan-y}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%}
.zoom{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #ddd;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;max-width:100%}
.thumbs button{flex:0 0 72px;width:72px;height:72px;background:#fff;border:2px solid transparent;padding:0;position:relative;cursor:pointer}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%}
.info{text-align:center;min-width:0;padding-top:8px}
.ptitle{font-size:clamp(24px,5vw,34px);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:6px 0 0;overflow-wrap:anywhere}
.pprice{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.06em;color:var(--gold-hi);margin:12px 0 4px}
.pdesc{text-align:left;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere;margin:20px 0}
.buyrow{display:flex;gap:12px;align-items:stretch;justify-content:center;flex-wrap:wrap;margin-top:18px}
.buyrow .btn{flex:1 1 180px;padding-block:14px}
.back{display:inline-block;margin-top:10px}
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:10px}
.pimg{border:1px solid var(--border);background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pimg .box1{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.pimg .box1 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pimg .tag{font-size:11px;font-weight:700;color:var(--accent);text-align:center}
.pimg button{font-size:12px;padding:4px 6px}
.foot{border-top:1px solid var(--border);padding-block:26px;color:var(--mut);font-size:13px}
.foot .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

@media (max-width:760px){
  .admin{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--gold-deep)}
  .side h2{display:none}
  .side button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .side button.on{border-bottom-color:var(--gold)}
  .main{padding:20px 16px}
  .cart,.detail,.two{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:minmax(0,1fr) auto}
  .line .qty{grid-column:1}
  .brand{font-size:21px}
  .pp{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 48px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card-body{padding:10px;gap:4px}
  .card-body h3{font-size:16px}
  .price{font-size:18px}
  .mono{font-size:56px}
  .card-body .btn{padding:8px 10px;font-size:13px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.chip,.btn{transition:border-color .15s,background .15s,color .15s}
}
</style>
</head>
<body>
<div id="root"></div>
<noscript>This shop needs JavaScript turned on.</noscript>

<!-- ============================================================
     SETUP: paste your two Supabase values between the quotes.
     Supabase dashboard > Project Settings > API
       Project URL  -> looks like https://abcdxyz.supabase.co
       anon public key -> a long string starting with eyJ
     The anon key is meant to be public. Row-level security in
     supabase-setup.sql is what protects your data.
     ============================================================ -->
<script>
window.SHOP_CONFIG = {
  SUPABASE_URL: "PASTE_YOUR_PROJECT_URL_HERE",
  SUPABASE_ANON_KEY: "PASTE_YOUR_ANON_PUBLIC_KEY_HERE"
};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const h=React.createElement;
const {useState,useEffect,useRef,useSyncExternalStore,Fragment}=React;

const CFG=window.SHOP_CONFIG||{};
const configured=/^https:\/\/.+\.supabase\.co/.test(CFG.SUPABASE_URL||'')&&(CFG.SUPABASE_ANON_KEY||'').length>40;
const BUCKET='shop-images';
let sb=null;
if(configured&&window.supabase){sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY)}

const ROUTES=['shop','cart','my-orders','pay','login','admin'];
const STATUS={pending:'Pending',accepted:'Accepted',completed:'Completed',declined:'Declined',cancelled:'Cancelled'};
const PAY={qr:'Pay by QR code',cod:'Cash on delivery',cop:'Cash on pick up'};
const DEFAULTS={shopName:'Noir & Gold',tagline:'Bags, wallets and everyday carry.',contact:'',payNote:'',qrImage:null};

/* ---------- tiny store ---------- */
const ls={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let cart0={};try{cart0=JSON.parse(ls.get('ng_cart')||'{}')||{}}catch(e){}
let state={
  ready:false,configured,error:null,user:null,isAdmin:false,role:null,profile:null,
  products:[],orders:[],settings:Object.assign({},DEFAULTS),loaded:false,
  cart:cart0,modal:null,toast:null,payId:null
};
const listeners=new Set();
function setState(p){
  const n=Object.assign({},state,typeof p==='function'?p(state):p);
  n.role=n.user?(n.isAdmin?'admin':'buyer'):null;
  state=n;listeners.forEach(l=>l());
}
function useS(){return useSyncExternalStore(cb=>{listeners.add(cb);return()=>listeners.delete(cb)},()=>state)}
function saveCart(c){ls.set('ng_cart',JSON.stringify(c));setState({cart:c})}
let toastTimer,modalId=0;
function toast(msg){setState({toast:msg});clearTimeout(toastTimer);toastTimer=setTimeout(()=>setState({toast:null}),3200)}
function openModal(m){setState({modal:Object.assign({id:++modalId},m)})}
function closeModal(){setState({modal:null})}

/* ---------- helpers ---------- */
function peso(n){n=Number(n)||0;const whole=Math.abs(n-Math.round(n))<0.005;return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:whole?0:2,maximumFractionDigits:2})}
function shortPeso(n){return n>=1000?'₱'+(n/1000).toFixed(n%1000?1:0)+'k':'₱'+Math.round(n)}
function when(ts){return new Date(ts).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function go(r){location.hash=r}
function imgUrl(path){return path?sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl:''}
function resolveRoute(raw,S){
  let r=raw.indexOf('product/')===0?'product':(ROUTES.indexOf(raw)<0?'shop':raw);
  if(r==='login'){if(S.role==='buyer')return 'shop';if(S.role==='admin')return 'admin'}
  if(r==='admin'&&S.role!=='admin')return 'login';
  if((r==='my-orders'||r==='pay')&&S.role!=='buyer')return 'login';
  return r;
}
function cartCount(S){return Object.keys(S.cart).reduce((a,k)=>a+S.cart[k],0)}
function getProduct(S,id){return S.products.find(p=>p.id===id)}
const isSold=o=>o.status==='accepted'||o.status==='completed';
const initial=p=>(p.name||'?').charAt(0).toUpperCase();
function friendly(err){
  const m=(err&&err.message)||'';
  if(/invalid login/i.test(m))return 'Email or password is not right.';
  if(/already registered|already been registered/i.test(m))return 'That email already has an account. Log in instead.';
  if(/password should be at least|at least 6/i.test(m))return 'Use a password with at least 6 characters.';
  if(/valid email|invalid email|unable to validate email/i.test(m))return 'Enter a valid email address.';
  if(/email not confirmed/i.test(m))return 'Confirm your email first. Check your inbox for the link.';
  if(/rate limit|too many/i.test(m))return 'Too many tries. Wait a minute and try again.';
  if(/failed to fetch|network/i.test(m))return 'Cannot reach the shop. Check your connection.';
  return m||'Something went wrong. Try again.';
}

const mapProduct=r=>({id:r.id,name:r.name,price:Number(r.price),stock:r.stock,category:r.category||'',description:r.description||'',images:(r.images&&r.images.length)?r.images:(r.image_path?[r.image_path]:[]),image:(r.images&&r.images.length)?r.images[0]:(r.image_path||null),active:r.active,createdAt:Date.parse(r.created_at)||0});
const mapOrder=r=>({id:r.id,uid:r.user_id,status:r.status,payment:r.payment,note:r.note||'',total:Number(r.total),delivery:r.delivery||{},paid:!!r.paid,paidAt:r.paid_at?Date.parse(r.paid_at):null,payRef:r.pay_ref||'',createdAt:Date.parse(r.created_at),items:(r.order_items||[]).sort((a,b)=>a.id-b.id).map(i=>({pid:i.product_id,name:i.name,price:Number(i.price),qty:i.qty}))});
async function loadProducts(){
  const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  if(error){setState({loaded:true,error:'The shop could not load its products. Check that the SQL setup was run.'});return}
  setState({products:data.map(mapProduct),loaded:true,error:null});
}
async function loadSettings(){
  const {data}=await sb.from('settings').select('*').eq('id',1).maybeSingle();
  if(data)setState({settings:{shopName:data.shop_name,tagline:data.tagline,contact:data.contact,payNote:data.pay_note,qrImage:data.qr_path||null}});
}
async function loadOrders(){
  if(!state.user)return;
  const {data,error}=await sb.from('orders').select('*, order_items(*)').order('created_at',{ascending:false});
  if(!error)setState({orders:data.map(mapOrder)});
}
function refresh(){return Promise.all([loadProducts(),loadSettings(),loadOrders()])}

async function handleSession(session){
  const u=session?session.user:null;
  if(!u){setState({user:null,isAdmin:false,profile:null,orders:[]});return}
  const [adm,prof]=await Promise.all([sb.rpc('is_admin'),sb.from('profiles').select('*').eq('id',u.id).maybeSingle()]);
  let profile=prof.data?{name:prof.data.name,phone:prof.data.phone,address:prof.data.address}:null;
  if(!profile){
    const m=u.user_metadata||{};
    if(m.name||m.phone||m.address){
      profile={name:m.name||'',phone:m.phone||'',address:m.address||''};
      await sb.from('profiles').upsert(Object.assign({id:u.id},profile));
    }
  }
  setState({user:{id:u.id,email:u.email},isAdmin:adm.data===true,profile});
  loadOrders();
}

/* ---------- actions ---------- */
async function authLogin(email,password){
  if(!email.trim()||!password)return {error:'Enter your email and password.'};
  const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password});
  if(error)return {error:friendly(error)};
  await handleSession(data.session);
  go(state.isAdmin?'admin':(Object.keys(state.cart).length?'cart':'shop'));
  return {};
}
async function authSignup(f){
  if(!f.name.trim()||!f.phone.trim()||!f.address.trim())return {error:'Fill in your name, mobile number and address.'};
  if(!f.email.trim())return {error:'Enter your email.'};
  if(f.password.length<6)return {error:'Use a password with at least 6 characters.'};
  const {data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.password,options:{data:{name:f.name.trim(),phone:f.phone.trim(),address:f.address.trim()}}});
  if(error)return {error:friendly(error)};
  if(data.session){await handleSession(data.session);go(Object.keys(state.cart).length?'cart':'shop');return {}}
  return {info:'Account created. Check your email for a confirmation link, then log in.'};
}
async function authForgot(email){
  if(!email.trim())return {error:'Enter your email.'};
  const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});
  if(error)return {error:friendly(error)};
  return {info:'If that email has an account, a reset link is on its way.'};
}
async function adminLogin(email,password){
  if(!email.trim()||!password)return {error:'Enter the owner email and password.'};
  const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password});
  if(error)return {error:friendly(error)};
  await handleSession(data.session);
  if(!state.isAdmin){await sb.auth.signOut();await handleSession(null);return {error:'This account is not the shop owner.'}}
  closeModal();go('admin');
  return {};
}
async function logout(){await sb.auth.signOut();await handleSession(null);go('shop')}

function addToCart(id,n){
  const p=getProduct(state,id);if(!p)return;
  const cur=state.cart[id]||0,next=Math.min(p.stock,cur+n);
  const c=Object.assign({},state.cart);
  if(next<=0)delete c[id];else c[id]=next;
  saveCart(c);
  if(n>0)toast(next===cur?'No more stock available for '+p.name:'Added to cart');
}
function setQty(id,n){
  const p=getProduct(state,id);const c=Object.assign({},state.cart);
  if(!p||n<=0)delete c[id];else c[id]=Math.min(n,p.stock);
  saveCart(c);
}
async function placeOrder(payment,note,delivery){
  const items=[];
  Object.keys(state.cart).forEach(id=>{
    const p=getProduct(state,id),q=state.cart[id];
    if(p&&p.active&&p.stock>0)items.push({product_id:id,qty:Math.min(q,p.stock)});
  });
  if(!items.length)return 'Your cart has no available items.';
  const dv={name:delivery.name.trim(),phone:delivery.phone.trim(),address:delivery.address.trim()};
  if(!dv.name||!dv.phone||!dv.address)return 'Fill in your name, mobile number and address.';
  const {data,error}=await sb.rpc('place_order',{p_items:items,p_payment:payment,p_note:note.trim(),p_delivery:dv});
  if(error)return friendly(error);
  const pr=state.profile;
  if(!pr||pr.name!==dv.name||pr.phone!==dv.phone||pr.address!==dv.address){
    const up=await sb.from('profiles').upsert(Object.assign({id:state.user.id},dv));
    if(!up.error)setState({profile:dv});
  }
  saveCart({});
  await Promise.all([loadOrders(),loadProducts()]);
  if(payment==='qr'){setState({payId:data});toast('Order '+data+' placed. Scan the code to pay.');go('pay')}
  else{toast('Order '+data+' placed. The shop will confirm it soon.');go('my-orders')}
  return null;
}
async function setStatus(o,status){
  const fn=status==='cancelled'?sb.rpc('cancel_order',{p_order:o.id}):sb.rpc('set_order_status',{p_order:o.id,p_status:status});
  const {error}=await fn;
  if(error){toast(friendly(error));return}
  await Promise.all([loadOrders(),loadProducts()]);
  toast('Order '+o.id+' marked '+STATUS[status].toLowerCase());

async function reportPaid(o,ref){
  const {error}=await sb.rpc('report_payment',{p_order:o.id,p_ref:ref});
  if(error){toast(friendly(error));return false}
  await loadOrders();return true;
}
async function saveSettings(patch){

async function uploadImage(blob,folder,ext){
  const path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});
  if(error)throw error;
  return path;
}
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,1200/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.86);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
    img.src=url;
  });
}
let bgLib=null;
async function removeBg(file,onProgress){
  if(!bgLib)bgLib=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  return bgLib.removeBackground(file,{model:'isnet_quint8',output:{format:'image/png'},progress:(key,cur,total)=>{if(onProgress&&total)onProgress(cur/total)}});
}
function blobToImage(blob){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(blob),img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);res(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
    img.src=url;
  });
}
/* crop the cut-out to the product, centre it on a square transparent canvas */
async function tidyCutout(blob){
  const img=await blobToImage(blob);
  const sc0=Math.min(1,1400/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*sc0)),hh=Math.max(1,Math.round(img.height*sc0));
  const c0=document.createElement('canvas');c0.width=w;c0.height=hh;
  const x0=c0.getContext('2d');x0.drawImage(img,0,0,w,hh);
  const d=x0.getImageData(0,0,w,hh).data;
  let minX=w,minY=hh,maxX=-1,maxY=-1;
  for(let y=0;y<hh;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}
  if(maxX<0)return blob;
  const cw=maxX-minX+1,ch=maxY-minY+1,side=Math.round(Math.max(cw,ch)*1.12);
  const c=document.createElement('canvas');c.width=side;c.height=side;
  c.getContext('2d').drawImage(c0,minX,minY,cw,ch,Math.round((side-cw)/2),Math.round((side-ch)/2),cw,ch);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/png'));
}
async function downloadQr(url){
  try{
    const r=await fetch(url);const b=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='payment-qr.png';
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){window.open(url,'_blank')}
}

    const row={name,price,stock,category:f.cat.trim(),description:f.desc.trim(),images,image_path:images[0]||null,active:f.active,updated_at:new Date().toISOString()};
    setSaving(true);
    const res=p?await sb.from('products').update(row).eq('id',p.id):await sb.from('products').insert(row);
    if(res.error){setSaving(false);setErr('Could not save. '+friendly(res.error));return}
    await loadProducts();closeModal();toast(p?'Product saved':'Product added');
  };
  const del=async()=>{
    const {error}=await sb.from('products').delete().eq('id',p.id);
    if(error){setErr('Could not delete. '+friendly(error));return}
    await loadProducts();closeModal();toast('Product deleted');
  };
  return h('div',null,h('h2',null,p?'Edit product':'Add product'),
    h('form',{onSubmit:submit},
      h(Field,{id:'pf-name',label:'Name'},h('input',{id:'pf-name',autoFocus:true,maxLength:80,value:f.name,onChange:set('name')})),
      h('div',{className:'two'},
        h(Field,{id:'pf-price',label:'Price (₱)'},h('input',{id:'pf-price',type:'number',min:'0',step:'0.01',inputMode:'decimal',value:f.price,onChange:set('price')})),
        h(Field,{id:'pf-stock',label:'Stock'},h('input',{id:'pf-stock',type:'number',min:'0',step:'1',inputMode:'numeric',value:f.stock,onChange:set('stock')}))),
      h(Field,{id:'pf-cat',label:'Category'},h('input',{id:'pf-cat',maxLength:40,placeholder:'e.g. Bags, Wallets, Belts',value:f.cat,onChange:set('cat')})),
      h(Field,{id:'pf-desc',label:'Description'},h('textarea',{id:'pf-desc',value:f.desc,onChange:set('desc')})),
      h('div',{className:'field'},h('label',{htmlFor:'pf-file'},'Photos ('+images.length+')'),
        images.length?h('div',{className:'pimgs'},images.map((im,k)=>h('div',{className:'pimg',key:im},
          h('div',{className:'box1'},h('img',{src:imgUrl(im),alt:'Photo '+(k+1)})),
          k===0?h('div',{className:'tag'},'Main photo'):h('button',{type:'button',className:'btn',onClick:()=>move(k)},'Make main'),
          h('button',{type:'button',className:'btn btn-danger',onClick:()=>drop(k)},'Remove')))):
          h('p',{className:'meta',style:{margin:0}},'No photos yet. The first photo is the main one shown in the shop.'),
        h('input',{id:'pf-file',type:'file',accept:'image/*',multiple:true,disabled:working,onChange:onFiles}),
        h('div',{className:'check',style:{marginTop:10,marginBottom:0}},
          h('input',{id:'pf-bg',type:'checkbox',checked:stripBg,disabled:working,onChange:e=>{setStripBg(e.target.checked);ls.set('ng_stripbg',e.target.checked?'1':'0')}}),
          h('label',{htmlFor:'pf-bg'},'Remove the background automatically')),
        status?h('div',{className:'meta',style:{marginTop:6}},status):null),
      h('div',{className:'check'},h('input',{id:'pf-active',type:'checkbox',checked:f.active,onChange:e=>setF(Object.assign({},f,{active:e.target.checked}))}),h('label',{htmlFor:'pf-active'},'Show in the shop')),
      err?h('p',{className:'err'},err):null,
      h('div',{className:'actions'},
        h('button',{className:'btn btn-gold',type:'submit',disabled:saving||working},'Save product'),
        h('button',{className:'btn',type:'button',onClick:closeModal},'Cancel'),
        p?h('button',{className:'btn btn-danger',type:'button',onClick:()=>setConfirmDel(true)},'Delete'):null),
      confirmDel?h('div',{className:'actions',style:{marginTop:12}},h('span',{className:'meta'},'Delete this product for good?'),
        h('button',{className:'btn btn-danger btn-sm',type:'button',onClick:del},'Yes, delete'),
        h('button',{className:'btn btn-sm',type:'button',onClick:()=>setConfirmDel(false)},'Keep it')):null));
}
function OrdersTab({S}){
  const [filter,setFilter]=useState('pending');
  const orders=S.orders;
  const keys=['pending','accepted','completed','declined','cancelled','all'];
  const count=k=>k==='all'?orders.length:orders.filter(o=>o.status===k).length;
  const list=filter==='all'?orders:orders.filter(o=>o.status===filter);
  return h(Fragment,null,
    h('div',{className:'head'},h('div',null,h('h1',null,'Orders'),h('p',{className:'muted',style:{margin:0}},'Accept an order to take the items out of stock.')),h('button',{className:'btn btn-sm',onClick:()=>{loadOrders();toast('Orders refreshed')}},'Refresh')),
    h('div',{className:'chips',style:{marginBottom:18}},keys.map(k=>h('button',{key:k,className:'chip'+(filter===k?' on':''),onClick:()=>setFilter(k)},(k==='all'?'All':STATUS[k])+' ('+count(k)+')'))),
    list.length?h('div',{className:'orders'},list.map(o=>h(OrderCard,{key:o.id,o,admin:true}))):
    h(Empty,{style:{margin:0},title:orders.length?'Nothing here':'No orders yet',text:orders.length?'No orders with this status.':'When customers order, they appear here for you to accept.'}));
}
function ShopForm({S}){
  const mk=()=>({shopName:S.settings.shopName,tagline:S.settings.tagline,contact:S.settings.contact,payNote:S.settings.payNote});
  const [f,setF]=useState(mk);const [msg,setMsg]=useState(null);
  useEffect(()=>{setF(mk())},[S.settings]);
  const set=k=>e=>setF(Object.assign({},f,{[k]:e.target.value}));
  const submit=async e=>{
    e.preventDefault();setMsg(null);
    const data={shopName:f.shopName.trim()||DEFAULTS.shopName,tagline:f.tagline.trim(),contact:f.contact.trim(),payNote:f.payNote.trim()};
    try{await saveSettings(data);toast('Settings saved')}
    catch(x){setMsg('Could not save. '+friendly(x))}
  };
  return h('form',{className:'box',onSubmit:submit},h('h2',null,'Shop details'),
    h(Field,{id:'s1',label:'Shop name'},h('input',{id:'s1',maxLength:40,value:f.shopName,onChange:set('shopName')})),
    h(Field,{id:'s2',label:'Tagline'},h('input',{id:'s2',maxLength:120,value:f.tagline,onChange:set('tagline')})),
    h(Field,{id:'s3',label:'Contact (shown in the footer)'},h('input',{id:'s3',maxLength:120,placeholder:'Messenger, phone or email',value:f.contact,onChange:set('contact')})),
    h(Field,{id:'s4',label:'Payment instructions'},h('textarea',{id:'s4',placeholder:'Account name, number, or notes shown with the QR code',value:f.payNote,onChange:set('payNote')})),
    msg?h('p',{className:'err'},msg):null,
    h('button',{className:'btn btn-gold',type:'submit'},'Save details'));
}
function QrForm({S}){
  const [status,setStatus]=useState('');const [bad,setBad]=useState(false);
  const path=S.settings.qrImage;
  const onFile=async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    setStatus('Uploading…');
    try{
      const ext=(file.type.split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'')||'png';
      const np=await uploadImage(file,'qr',ext);
      const old=path;
      await saveSettings({qrImage:np});
      if(old)sb.storage.from(BUCKET).remove([old]);
      setBad(false);setStatus('QR code saved. Customers see it at checkout.');
    }catch(x){setStatus('The QR code could not be uploaded. '+friendly(x))}
    e.target.value='';
  };
  const remove=async()=>{try{const old=path;await saveSettings({qrImage:null});if(old)sb.storage.from(BUCKET).remove([old]);setStatus('QR code removed.')}catch(x){setStatus('Could not remove it. Try again.')}};
  return h('div',{className:'box'},h('h2',null,'Payment QR code'),
    h('p',{className:'meta',style:{marginTop:-4}},'Upload your QR code from GCash, Maya or your bank. A QR Ph code works with all of them. Customers who choose QR payment scan it after they place an order.'),
    path&&!bad?h('div',{className:'qrcard',style:{margin:'0 0 14px',border:'1px solid var(--border)',maxWidth:240}},h('img',{src:imgUrl(path),alt:'Current payment QR code',onError:()=>setBad(true)})):h('p',{className:'meta'},'No QR code uploaded yet.'),
    h(Field,{id:'qr-file',label:path?'Replace QR code':'Upload QR code'},h('input',{id:'qr-file',type:'file',accept:'image/*',onChange:onFile})),
    status?h('p',{className:'meta'},status):null,
    path?h('button',{className:'btn btn-danger btn-sm',onClick:remove},'Remove QR code'):null);
}
function PasswordForm({S}){
  const [cur,setCur]=useState('');const [n1,setN1]=useState('');const [n2,setN2]=useState('');
  const [msg,setMsg]=useState(null);const [busy,setBusy]=useState(false);
  const submit=async e=>{
    e.preventDefault();setMsg(null);
    if(n1.length<6){setMsg({bad:1,t:'The new password needs at least 6 characters.'});return}
    if(n1!==n2){setMsg({bad:1,t:'The two new passwords do not match.'});return}
    setBusy(true);
    const chk=await sb.auth.signInWithPassword({email:S.user.email,password:cur});
    if(chk.error){setBusy(false);setMsg({bad:1,t:'Your current password is not right.'});return}
    const {error}=await sb.auth.updateUser({password:n1});
    setBusy(false);
    if(error){setMsg({bad:1,t:friendly(error)});return}
    setCur('');setN1('');setN2('');setMsg({t:'Password changed. Use the new one next time you log in.'});
  };
  return h('form',{className:'box',onSubmit:submit},h('h2',null,'Admin password'),
    h('p',{className:'meta',style:{marginTop:-4}},'Signed in as '+S.user.email+'. You enter this password each time you use Admin login.'),
    h(Field,{id:'pw0',label:'Current password'},h('input',{id:'pw0',type:'password',autoComplete:'current-password',value:cur,onChange:e=>setCur(e.target.value)})),
    h(Field,{id:'pw1',label:'New password'},h('input',{id:'pw1',type:'password',autoComplete:'new-password',value:n1,onChange:e=>setN1(e.target.value)})),
    h(Field,{id:'pw2',label:'Confirm new password'},h('input',{id:'pw2',type:'password',autoComplete:'new-password',value:n2,onChange:e=>setN2(e.target.value)})),
    msg?h('p',{className:msg.bad?'err':'ok'},msg.t):null,
    h('button',{className:'btn btn-gold',type:'submit',disabled:busy},busy?'Saving…':'Change password'));
}
function SettingsTab({S}){
  return h(Fragment,null,h('h1',null,'Settings'),h('p',{className:'sub muted'},'Shop details show on the storefront and at checkout.'),
    h('div',{className:'stack'},h(ShopForm,{S}),h(QrForm,{S}),h(PasswordForm,{S})));
}
function Admin({S}){
  const [tab,setTab]=useState('overview');
  const pending=S.orders.filter(o=>o.status==='pending').length;
  const tabs=[['overview','Overview'],['products','Products'],['orders','Orders'],['settings','Settings']];
  return h('div',{className:'wrap',style:{paddingBlock:'24px 56px'}},h('div',{className:'admin'},
    h('nav',{className:'side','aria-label':'Dashboard'},h('h2',null,'Dashboard'),
      tabs.map(t=>h('button',{key:t[0],className:tab===t[0]?'on':'',onClick:()=>setTab(t[0])},t[1],t[0]==='orders'&&pending?h('span',{className:'badge'},pending):null))),
    h('div',{className:'main light'},
      tab==='overview'?h(Overview,{S}):tab==='products'?h(ProductsTab,{S}):tab==='orders'?h(OrdersTab,{S}):h(SettingsTab,{S}))));
}

/* ---------- app ---------- */
function ModalHost({S}){
  const m=S.modal;if(!m)return null;
  let body;
  if(m.type==='detail')body=h(Detail,{p:m.product});
  else if(m.type==='adminLogin')body=h(AdminLoginModal);
  else if(m.type==='recovery')body=h(RecoveryModal);
  else if(m.type==='zoom')body=h('div',null,h('div',{style:{background:'#fff'}},h('img',{src:m.src,alt:'',style:{display:'block',width:'100%',maxHeight:'80vh',objectFit:'contain'}})),h('div',{style:{marginTop:12}},h('button',{className:'link',onClick:closeModal},'Close')));
  else body=h(ProductForm,{p:m.product});
  return h('div',{className:'veil',onMouseDown:e=>{if(e.target===e.currentTarget)closeModal()}},
    h('div',{key:m.id,className:'modal'+(m.wide?' wide':'')+(m.light?' light':''),role:'dialog','aria-modal':'true'},body));
}
function useHash(){
  const [hash,setHash]=useState(location.hash);
  useEffect(()=>{const f=()=>{setHash(location.hash);window.scrollTo(0,0)};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
  return hash.slice(1);
}
function Setup(){
  return h('div',{className:'wrap page'},h('h1',null,'Almost ready'),
    h('div',{className:'notice'},
      h('p',{style:{marginTop:0}},'This shop is not connected to a database yet.'),
      h('p',{className:'muted'},'Open index.html, find the SHOP_CONFIG block near the top, and paste in your Supabase project URL and anon key. The README has the full steps.'),
      h('p',{className:'muted',style:{marginBottom:0}},'Reload this page after you save the file.')));
}
function App(){
  const S=useS();const raw=useHash();
  useEffect(()=>{const k=e=>{if(e.key==='Escape')closeModal()};document.addEventListener('keydown',k);return()=>document.removeEventListener('keydown',k)},[]);
  useEffect(()=>{document.title=S.settings.shopName},[S.settings.shopName]);
  if(!S.configured||!sb)return h(Setup);
  const route=resolveRoute(raw,S);
  const protectedRaw=raw==='login'||raw==='admin'||raw==='my-orders'||raw==='pay';
  let view;
  if(!S.ready&&protectedRaw)view=h('div',{className:'wrap page'},h('p',{className:'muted'},'Loading…'));
  else if(route==='shop')view=h(Shop,{S});
  else if(route==='product')view=h(ProductPage,{S,id:raw.slice(8)});
  else if(route==='cart')view=h(Cart,{S});
  else if(route==='my-orders')view=h(MyOrders,{S});
  else if(route==='pay')view=h(Pay,{S});
  else if(route==='login')view=h(Login);
  else view=h(Admin,{S});
  return h(Fragment,null,h(Header,{S,route}),view,h(Footer,{S}),h(ModalHost,{S}),S.toast?h('div',{className:'toast',role:'status'},S.toast):null);
}

/* ---------- start ---------- */
async function init(){
  if(!configured||!sb)return;
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY')setTimeout(()=>{handleSession(session);openModal({type:'recovery'})},0);
    if(event==='SIGNED_OUT')setTimeout(()=>handleSession(null),0);
    if(event==='SIGNED_IN'&&session&&(!state.user||state.user.id!==session.user.id))setTimeout(()=>handleSession(session),0);
  });
  const {data}=await sb.auth.getSession();
  await Promise.all([handleSession(data.session),loadProducts(),loadSettings()]);
  setState({ready:true});
  setInterval(()=>{if(!document.hidden)refresh()},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
init();
})();

</script>
